name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF extraction dependency
        run: python -m pip install --upgrade pip pymupdf
      - name: Rebuild deterministic assets from official PDFs
        run: python3 tools/build_content.py
      - name: Ensure committed assets match builder output
        run: git diff --exit-code assets/
      - name: Verify curriculum, SVG diagrams, and official exam templates
        run: python3 tools/verify_content.py

  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch packages
        run: flutter pub get
      - name: Static analysis
        run: |
          set -o pipefail
          mkdir -p build
          flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee build/analyze.log
      - name: Annotate analyzer findings
        if: always()
        run: python3 tools/ci_report.py analyze build/analyze.log
      - name: Unit, widget, layout & OOXML Word exam tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee build/test.log
      - name: Summarize test results
        if: always()
        run: python3 tools/ci_report.py test build/test.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-test-logs
          path: |
            build/analyze.log
            build/test.log
            layout-report.txt
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bayan-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows x64 portable
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Smoke-check portable bundle
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$dir/bayan.exe")) {
            Write-Error "bayan.exe missing in $dir"
            exit 1
          }
          if (-not (Test-Path "$dir/flutter_windows.dll")) {
            Write-Error "flutter_windows.dll missing in $dir"
            exit 1
          }
          if (-not (Test-Path "$dir/data/flutter_assets/assets/content/curriculum.json")) {
            Write-Error "bundled curriculum.json missing"
            exit 1
          }
          $proc = Start-Process -FilePath "$dir/bayan.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            Write-Error "bayan.exe exited early with code $($proc.ExitCode)"
            exit 1
          }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
          }
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "bayan-windows-x64.zip" -Force
      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: bayan-windows-x64
          path: bayan-windows-x64.zip
          if-no-files-found: error
