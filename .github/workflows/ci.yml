name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.0
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  content:
    name: Content fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser used by content tools
        run: python -m pip install --quiet --disable-pip-version-check pymupdf
      - name: Rebuild deterministic assets and check clean diff
        run: |
          python3 tools/build_content.py
          git diff --exit-code assets/
      - name: Verify generated content, SVGs, and official exam templates
        run: |
          set +e
          python3 tools/verify_content.py 2>&1 | tee "$RUNNER_TEMP/content.txt"
          status=${PIPESTATUS[0]}
          python3 tools/ci_report.py log "$RUNNER_TEMP/content.txt"
          exit $status

  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Flutter SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-sdk-linux-${{ env.FLUTTER_VERSION }}
      - name: Install the official Flutter ${{ env.FLUTTER_VERSION }} SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf /tmp/flutter.tar.xz -C "$HOME"
      - name: Put Flutter on the PATH
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"
      - name: Resolve the dependencies
        run: flutter pub get
      - name: Static analysis (Dart)
        run: |
          set +e
          dart analyze --fatal-warnings --format machine > "$RUNNER_TEMP/analysis.txt" 2>&1
          status=$?
          python3 tools/ci_report.py analyze "$RUNNER_TEMP/analysis.txt"
          exit $status
      - name: Flutter static analysis
        run: |
          set +e
          flutter analyze --no-pub --fatal-infos --fatal-warnings 2>&1 | tee "$RUNNER_TEMP/flutter-analysis.txt"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 tools/ci_report.py log "$RUNNER_TEMP/flutter-analysis.txt"
          fi
          exit $status
      - name: Unit, widget, layout & OOXML Word exam tests
        run: |
          set +e
          flutter test -j 1 --reporter json > "$RUNNER_TEMP/tests.json" 2>&1
          status=$?
          python3 tools/ci_report.py test "$RUNNER_TEMP/tests.json" "$status"
          exit $status

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the Flutter SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-sdk-linux-${{ env.FLUTTER_VERSION }}
      - name: Install the official Flutter ${{ env.FLUTTER_VERSION }} SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf /tmp/flutter.tar.xz -C "$HOME"
      - name: Put Flutter on the PATH
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"
      - name: Build the release APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/apk-build.log"
          status=${PIPESTATUS[0]}
          python3 tools/ci_report.py log "$RUNNER_TEMP/apk-build.log"
          exit $status
      - name: Verify the packaged APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ls -l "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/badging.txt
          head -12 /tmp/badging.txt
          grep -q "package: name='com.techtouchai.bayan'" /tmp/badging.txt
          grep -q "sdkVersion:'24'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          APK_ENTRIES="$RUNNER_TEMP/apk-entries.txt"
          unzip -Z1 "$APK" > "$APK_ENTRIES"
          for asset in \
            assets/content/curriculum.json \
            assets/content/lessons.json \
            assets/content/glossary.json \
            assets/content/exam_bank.json \
            assets/fonts/Almarai-Regular.ttf \
            assets/fonts/Amiri-Regular.ttf \
            assets/fonts/Cairo-Regular.ttf \
            assets/fonts/IBMPlexSansArabic-Regular.ttf \
            assets/fonts/NotoKufiArabic-Regular.ttf \
            assets/fonts/Tajawal-Regular.ttf \
            assets/illustrations/speech-parts.svg \
            assets/illustrations/five-verbs.svg ; do
            if ! grep -Fxq "assets/flutter_assets/$asset" "$APK_ENTRIES"; then
              echo "::error::the APK is missing $asset"
              exit 1
            fi
          done
          grep -Fxq "lib/arm64-v8a/libapp.so" "$APK_ENTRIES"
          grep -Fxq "lib/arm64-v8a/libflutter.so" "$APK_ENTRIES"
          echo "::notice::APK verified: package, SDK levels, and all bundled assets are present"
      - name: Copy the artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/bayan-${GITHUB_SHA::7}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: bayan-android-apk
          path: dist

  windows:
    name: Windows EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Flutter SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: C:\flutter
          key: flutter-sdk-windows-${{ env.FLUTTER_VERSION }}
      - name: Install the official Flutter ${{ env.FLUTTER_VERSION }} SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = $env:FLUTTER_VERSION
          $manifestUrl = 'https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json'
          $archivePath = "stable/windows/flutter_windows_$version-stable.zip"
          $listed = $false
          try {
            $manifest = Invoke-RestMethod -Uri $manifestUrl -UseBasicParsing
            $release = $manifest.releases |
              Where-Object { $_.version -eq $version -and $_.channel -eq 'stable' } |
              Select-Object -First 1
            if ($release) {
              $archivePath = $release.archive
              $listed = $true
            }
          } catch {}
          $archive = Join-Path $env:RUNNER_TEMP 'flutter.zip'
          $downloaded = $false
          if ($listed) {
            $url = "https://storage.googleapis.com/flutter_infra_release/releases/$archivePath"
            curl.exe -fL --retry 3 --retry-delay 5 --retry-all-errors -o $archive $url
            if (Test-Path $archive) {
              $downloaded = (Get-Item $archive).Length -gt 100MB
            }
          }
          if (-not $downloaded) {
            if (Test-Path 'C:\flutter') { Remove-Item -Recurse -Force 'C:\flutter' }
            git clone --depth 1 --branch $version https://github.com/flutter/flutter.git C:\flutter
          } else {
            Expand-Archive -Path $archive -DestinationPath 'C:\' -Force
          }
          if (-not (Test-Path 'C:\flutter\bin\flutter.bat')) { throw 'Flutter SDK layout unexpected' }
      - name: Put Flutter on the PATH
        shell: pwsh
        run: |
          echo "C:\flutter\bin" >> $env:GITHUB_PATH
          git config --global --add safe.directory C:/flutter
      - name: Enable Windows desktop & resolve dependencies
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter precache --windows
      - name: Build the Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log
          $status = $LASTEXITCODE
          python tools/ci_report.py log windows-build.log
          exit $status
      - name: Package & verify the Windows distribution
        shell: pwsh
        run: |
          $out = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$out\bayan.exe")) { throw "bayan.exe missing in $out" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\bayan-$($env:GITHUB_SHA.Substring(0,7))-windows-x64.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path).Entries |
            ForEach-Object { $_.FullName.Replace('/', '\') }
          $required = @(
            'bayan.exe',
            'flutter_windows.dll',
            'printing_plugin.dll',
            'pdfium.dll',
            'data\flutter_assets\assets\content\curriculum.json',
            'data\flutter_assets\assets\content\exam_bank.json',
            'data\flutter_assets\assets\fonts\Almarai-Regular.ttf',
            'data\flutter_assets\assets\fonts\Amiri-Regular.ttf',
            'data\flutter_assets\assets\illustrations\speech-parts.svg'
          )
          foreach ($item in $required) {
            if ($entries -notcontains $item) {
              Write-Host "::error::the Windows archive is missing $item"
              exit 1
            }
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Out-File -Encoding ascii dist\SHA256SUMS.txt
      - name: Smoke test bayan.exe
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = 'build\windows\x64\runner\Release\bayan.exe'
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            Write-Host "::error::bayan.exe exited early with code $($proc.ExitCode)"
            exit 1
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: bayan-windows-x64
          path: dist
